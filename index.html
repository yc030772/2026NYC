  .tabs button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  main { max-width:860px; margin:0 auto; padding:20px 16px 72px; }

  .daypick { display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; margin-bottom:12px; scrollbar-width:none; }

  .daypick button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  /* info */
  .info { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .info h2 { font-size:17px; margin:0 0 8px; }
  .info h2 small { color:var(--muted); font-weight:normal; font-size:13px; margin-left:8px; }
  .info ul { margin:0; padding-left:18px; }
  .info li { padding:2px 0; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:normal; }
  .free { color:var(--free); } .stu { color:var(--me); }
  /* day */
  .day { margin:28px 0 10px; display:flex; align-items:baseline; gap:10px; }
  .day h2 { font:700 26px "Playfair Display", serif; margin:0; }
  .day span { color:var(--muted); font-size:14px; }
  .item { display:grid; grid-template-columns:120px 1fr; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:10px; border-left:4px solid var(--c); }
  .item.me { --c:var(--me); } .item.us { --c:var(--us); }
  .item img { width:120px; height:100%; min-height:110px; object-fit:cover; display:block; background:var(--line); }
  .item .ph { width:120px; min-height:110px; background:var(--line); }
  .item .b { padding:12px 14px 12px 0; min-width:0; }
  .item .t { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .item .t b { font-variant-numeric:tabular-nums; color:var(--c); }
  .item .t h3 { margin:0; font-size:16px; font-weight:500; }
  .item .d { color:var(--muted); font-size:14px; margin:4px 0; }
  .item .tr { font-size:13px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .item .tr a { color:var(--me); text-decoration:none; }
  .tag { font-size:12px; padding:0 6px; border-radius:4px; border:1px solid currentColor; }
  .cost { color:var(--muted); font-size:14px; margin:4px 0 0 4px; }
  .who { font-size:12px; color:var(--muted); }
  @media (max-width:520px) { .item { grid-template-columns:92px 1fr; } .item img, .item .ph { width:92px; } .hero h1 { font-size:34px; } }

  <tr><td>百老匯</td><td>$150+</td><td class="stu">TodayTix / 官方 app 每天抽 lottery $30–50；售票口問 student rush</td></tr>
  <tr><td>Met Opera / NY Phil / Carnegie</td><td>$100+</td><td class="stu">student rush 約 $35，要註冊學生帳號</td></tr>

  <p class="cost">☐ 出發前辦 ISIC 國際學生證（康文文教基金會，約 NT$400）</p></div>

let tab = 'jerry', dayIdx = -1;
const map = L.map('map', {scrollWheelZoom:false}).setView([40.745,-73.98], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap', maxZoom:19}).addTo(map);
L.circleMarker(HOTEL, {radius:8, color:'#111', fillColor:'#fff', fillOpacity:1}).addTo(map).bindTooltip('Hyatt House', {permanent:true, direction:'left'});
let layer = L.layerGroup().addTo(map);

const gmaps = (p) => `https://www.google.com/maps/dir/?api=1&destination=${p.ll[0]},${p.ll[1]}&travelmode=transit`;
const vis = (it) => tab === 'jerry' || it.w === 'us';

function render() {
  document.getElementById('info').innerHTML = INFO[tab] + INFO.both;
  document.getElementById('days').innerHTML = DAYS.map((day, i) => {
    const items = day.items.filter(vis);
    return `<div class="day" id="day${i}"><h2>${day.d}</h2><span>${day.sub}</span></div>` +
      items.map(it => `<div class="item ${it.w}">
        ${it.img ? `<img src="img/${it.img}.jpg" alt="" loading="lazy">` : '<div class="ph"></div>'}
        <div class="b"><div class="t"><b>${it.t}</b><h3>${it.n}</h3>${(it.tag||[]).map(t=>`<span class="tag ${t}">${t==='free'?'免費':'學生價'}</span>`).join('')}<span class="who">${it.w==='me'?'Jerry':'一起'}</span></div>
        ${it.d ? `<div class="d">${it.d}</div>` : ''}
        <div class="tr">${it.tr ? `<span>🚇 ${it.tr.replace(/🚇 /g,'')}</span>` : ''}<a href="${gmaps(it)}" target="_blank">Google Maps 路線 ↗</a></div></div></div>`).join('') +
      `<p class="cost">💵 ${day.cost}</p>`;
  }).join('');
  drawMap();
}

function drawMap() {
  layer.clearLayers();
  const pts = [];
  DAYS.forEach((day, i) => { if (dayIdx >= 0 && i !== dayIdx) return;
    day.items.filter(vis).forEach(it => {
      const c = it.w === 'me' ? '#2563eb' : '#ea580c';
      L.circleMarker(it.ll, {radius:7, color:'#fff', weight:2, fillColor:c, fillOpacity:.95}).addTo(layer).bindPopup(`<b>${day.d} ${it.t}</b><br>${it.n}`);
      pts.push(it.ll);
    });
    if (dayIdx === i) L.polyline([HOTEL, ...pts], {color:'#888', weight:2, dashArray:'4 6'}).addTo(layer);
  });
  if (pts.length) map.fitBounds(L.latLngBounds(pts.concat([HOTEL])), {padding:[30,30], maxZoom:14});
  document.querySelectorAll('.daypick button').forEach((b, i) => b.classList.toggle('on', i - 1 === dayIdx));
}

document.getElementById('daypick').innerHTML = ['全部', ...DAYS.map(d => d.d)].map(d => `<button>${d}</button>`).join('');
document.querySelectorAll('.daypick button').forEach((b, i) => b.onclick = () => { dayIdx = i - 1; drawMap(); if (dayIdx >= 0) document.getElementById('day' + dayIdx).scrollIntoView({behavior:'smooth', block:'start'}); });
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); render(); });

document.getElementById('foot').textContent = '門票大約：Met $22 + MoMA $17 + 911 $27 + Cloisters $22 + AMNH $22 + Top of the Rock $40 ≈ $150，其他全免費。11 月下旬日落約 16:30，白天行程要早出門。';
render();
</script>
